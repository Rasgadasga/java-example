name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Java project
        run: mvn clean package

      - name: Build Docker image
        run: docker build -t java-example .

      - name: Run Docker container
        run: docker run java-example
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag java-example ghcr.io/rasgadasga/java-example:1.0

      - name: Push Docker image
        run: docker push ghcr.io/rasgadasga/java-example:1.0

  staging:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ghcr.io/rasgadasga/java-example:1.0
      
      - name: Run container in staging
        run: docker run --rm -e APP_ENV=staging ghcr.io/rasgadasga/java-example:1.0